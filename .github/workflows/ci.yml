name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run the vulnerability check daily at 03:00 UTC on the default branch.
    - cron: "0 3 * * *"

# Least-privilege token: read source only. Only the image-push job adds packages: write, for itself.
permissions:
  contents: read

# Every third-party action is pinned by the full commit SHA its release tag resolves to (task 13; the tag is in the comment).
# The check: git ls-remote https://github.com/<repo>.git refs/tags/<tag>^{} gives this SHA, and the GitHub release of that tag exists,
# is not a draft and not a pre-release. web/src/test/java/dev/chatledger/deploy/WorkflowFileTest.java refuses an unpinned `uses:`.

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Throwaway credentials, random for every run and masked in the log. Nothing here
      # reaches a real database; the integration tests start their own with their own random ones.
      - name: Generate throwaway credentials
        run: |
          for name in DB_PASSWORD APP_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      # ── Build and run unit tests ─────────────────────────────────────
      # Surefire runs every *Test.java and *Tests.java class.
      # Secrets are never present in CI; the test profile disables the DB.
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify
        env:
          # Non-secret connection details; the password and app secret come from the step above.
          DB_URL: jdbc:postgresql://localhost:5432/chatledger_ci
          DB_USER: ci_user

  vulnerability-check:
    name: OWASP dependency vulnerability check
    # Run on pull requests targeting main and on the daily schedule.
    # Skipped on plain pushes to keep the push feedback loop fast.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Throwaway credentials, random for every run and masked in the log. Nothing here
      # reaches a real database; the integration tests start their own with their own random ones.
      - name: Generate throwaway credentials
        run: |
          for name in DB_PASSWORD APP_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      # ── NVD data cache ───────────────────────────────────────────────
      # The dependency-check plugin downloads NVD CVE data on first run
      # (~200 MB). Caching it avoids re-downloading the full feed on every
      # PR. The key includes run_id so the cache is always saved with
      # fresh data; restore-keys: nvd- picks up the most recent prior run.
      - name: Cache NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # ── OWASP dependency check ───────────────────────────────────────
      # NVD_API_KEY speeds up the NVD feed download and avoids rate-limiting.
      # Store the key as a repository secret named NVD_API_KEY.
      # Fails the build if any dependency has a CVSS score >= 7.
      - name: Run OWASP dependency check
        run: mvn --batch-mode --no-transfer-progress -P security-check verify -DskipTests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/chatledger_ci
          DB_USER: ci_user
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP dependency check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  # ── The image, in three jobs (task 13, the owner's change 1) ───────────────────────────────────────
  # (a) build to an archive, never pushed from here; (b) scan that archive; (c) push it, from a job that runs no third-party code.

  image-build:
    name: Image, build and drill
    runs-on: ubuntu-24.04
    needs: build-and-test
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the image (no secret, no push)
        run: docker build --pull --build-arg "REVISION=${GITHUB_SHA}" -t chat-ledger:test .

      - name: Check the image
        run: sh deploy/check-image.sh chat-ledger:test

      # The VPS stack from nothing, on this Linux runner, with this image: real file modes, uid 70 and 65532, read-only roots.
      - name: Run the stack and the smoke script
        run: sudo sh deploy/test-stack.sh "${RUNNER_TEMP}/chat-ledger-stack"

      - name: Save the archive
        id: save
        run: |
          docker save chat-ledger:test -o chat-ledger.tar
          echo "image-id=$(docker image inspect -f '{{.Id}}' chat-ledger:test)" >> "$GITHUB_OUTPUT"

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-ledger-image
          path: chat-ledger.tar
          retention-days: 3
          if-no-files-found: error

  image-scan:
    name: Image, scan
    runs-on: ubuntu-24.04
    needs: image-build
    # No packages permission: this job runs a third-party scanner.
    permissions:
      contents: read
    steps:
      - name: Download the archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chat-ledger-image

      - name: The archive is the one built
        env:
          BUILT: ${{ needs.image-build.outputs.image-id }}
        run: |
          docker load -i chat-ledger.tar
          loaded="$(docker image inspect -f '{{.Id}}' chat-ledger:test)"
          test "$loaded" = "$BUILT" || { echo "The archive is $loaded, the build produced $BUILT."; exit 1; }

      # Trivy from its own image, pinned by digest (0.76.2). Fails on a fixable HIGH or CRITICAL finding; then lists everything.
      - name: Scan (fails on fixable HIGH or CRITICAL)
        run: >
          docker run --rm --network bridge -v "${PWD}/chat-ledger.tar:/work/chat-ledger.tar:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --input /work/chat-ledger.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

      - name: List every finding (does not fail)
        if: always()
        run: >
          docker run --rm --network bridge -v "${PWD}/chat-ledger.tar:/work/chat-ledger.tar:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --input /work/chat-ledger.tar --exit-code 0 --no-progress

  image-push:
    name: Image, push
    runs-on: ubuntu-24.04
    needs: [image-build, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: image-push
    # The only job that can write a package. It runs GitHub's artifact action and the Docker CLI, nothing else.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chat-ledger-image

      - name: The archive is the one built and scanned
        env:
          BUILT: ${{ needs.image-build.outputs.image-id }}
        run: |
          docker load -i chat-ledger.tar
          loaded="$(docker image inspect -f '{{.Id}}' chat-ledger:test)"
          test "$loaded" = "$BUILT" || { echo "The archive is $loaded, the build produced $BUILT."; exit 1; }

      - name: Push by commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          BUILT: ${{ needs.image-build.outputs.image-id }}
        run: |
          ref="ghcr.io/deval123/chat-ledger:${GITHUB_SHA}"
          docker tag chat-ledger:test "$ref"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$ref"
          docker logout ghcr.io
          digest="$(docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep '^ghcr.io/deval123/chat-ledger@' | head -n 1 | cut -d@ -f2)"
          test -n "$digest" || { echo "No digest after the push."; exit 1; }
          # What the registry holds is this image: its manifest names the built image (classic store: the config is the id;
          # containerd store: the id is the manifest itself).
          manifest="$(docker buildx imagetools inspect --raw "ghcr.io/deval123/chat-ledger@${digest}")"
          if [ "$digest" != "$BUILT" ] && ! printf '%s' "$manifest" | grep -q "\"digest\": *\"${BUILT}\""; then
            echo "The pushed manifest does not name the built image ${BUILT}."; exit 1
          fi
          {
            echo "### Image pushed"
            echo ""
            echo "For /opt/chat-ledger/.env on the VPS:"
            echo ""
            echo '```'
            echo "CHAT_LEDGER_DIGEST=${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
