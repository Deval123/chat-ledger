name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run the vulnerability check daily at 03:00 UTC on the default branch.
    - cron: "0 3 * * *"

# Least-privilege token: read source only. Only the image-push job adds packages: write, for itself.
permissions:
  contents: read

# Every third-party action is pinned by the full commit SHA its release tag resolves to (task 13; the tag is in the comment).
# The check: git ls-remote https://github.com/<repo>.git refs/tags/<tag>^{} gives this SHA, and the GitHub release of that tag exists,
# is not a draft and not a pre-release. web/src/test/java/dev/chatledger/deploy/WorkflowFileTest.java refuses an unpinned `uses:`.

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Throwaway credentials, random for every run and masked in the log. Nothing here
      # reaches a real database; the integration tests start their own with their own random ones.
      - name: Generate throwaway credentials
        run: |
          for name in DB_PASSWORD APP_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      # ── Build and run unit tests ─────────────────────────────────────
      # Surefire runs every *Test.java and *Tests.java class.
      # Secrets are never present in CI; the test profile disables the DB.
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress --strict-checksums verify
        env:
          # Non-secret connection details; the password and app secret come from the step above.
          DB_URL: jdbc:postgresql://localhost:5432/chatledger_ci
          DB_USER: ci_user

  # ── Accessibility in a real browser (task 12a, D2) ─────────────────────────────────────────────────
  # The demo flow walked by keyboard in a pinned Chrome for Testing, with axe-core: what no static check sees (focus, the live region,
  # reflow at 360 px and 200 % zoom). Third-party code runs here (Chrome, axe-core, puppeteer-core), so this job has no secret, no write
  # permission, and nothing from it is uploaded or reaches the image: the image is built in image-build, from the Dockerfile only.
  a11y-browser:
    name: Accessibility in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Chrome for Testing publishes no checksum; this SHA-256 was taken from the first download and pins every later one.
      CFT_VERSION: "157.0.8103.50"
      CFT_SHA256: "d17167bc092eb495a3b768c7467f27e35f625aa03834233a1663af67dcb668c9"
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"

      - name: Generate throwaway credentials
        run: |
          for name in DB_PASSWORD APP_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: Cache Chrome for Testing
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/cft
          key: cft-linux64-${{ env.CFT_VERSION }}-${{ env.CFT_SHA256 }}

      # The zip is checked against the pinned SHA-256 whether it came from the cache or the network.
      # The sandbox stays on: Ubuntu 24.04 forbids the user namespaces it would use, so Chrome's own setuid helper is installed instead.
      - name: Fetch, verify and install Chrome for Testing
        run: |
          zip="$HOME/cft/chrome-linux64-${CFT_VERSION}.zip"
          mkdir -p "$HOME/cft"
          if [ ! -f "$zip" ]; then
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -o "$zip" \
              "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          fi
          echo "${CFT_SHA256}  ${zip}" | sha256sum -c -
          unzip -q -o "$zip" -d "$RUNNER_TEMP/cft"
          sudo install -o root -g root -m 4755 "$RUNNER_TEMP/cft/chrome-linux64/chrome_sandbox" /usr/local/sbin/chrome-devel-sandbox
          echo "CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$RUNNER_TEMP/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"

      # The npm lockfile is scanned before anything from it is installed, with the CI scanner (pinned by digest).
      - name: Scan the browser tool's dependencies (fails on fixable HIGH or CRITICAL)
        run: >
          docker run --rm --network bridge -v "${PWD}/tools/browser-check:/work:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress /work

      # The OWASP check skips test scope, so the test-only HTML parser is scanned here (register 167). rootfs mode: fs mode does not
      # read jars. Checked by hand against commons-text 1.9, which this step refuses (CVE-2022-42889).
      - name: Scan the test-only jsoup jar (fails on fixable HIGH or CRITICAL)
        run: |
          # By coordinates, from the root POM's pinned version: nothing of the reactor needs to be built first.
          version="$(sed -n 's:.*<jsoup.version>\([0-9.]*\)</jsoup.version>.*:\1:p' pom.xml)"
          test -n "$version" || { echo "No jsoup.version in pom.xml."; exit 1; }
          mvn --batch-mode --no-transfer-progress -q -N dependency:copy -Dartifact="org.jsoup:jsoup:${version}" \
            -DoutputDirectory="$RUNNER_TEMP/test-libs"
          test -n "$(find "$RUNNER_TEMP/test-libs" -name 'jsoup-*.jar')" || { echo "jsoup was not resolved."; exit 1; }
          docker run --rm --network bridge -v "$RUNNER_TEMP/test-libs:/work:ro" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            rootfs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress /work

      - name: Install the browser tool (lockfile only, no install scripts)
        working-directory: tools/browser-check
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The fixture is the application as the demo deployment runs it, on localhost, with its own throwaway database.
      # The walk ends it by writing /tmp/browser-demo.done; the step writes it too, so a crashed walk never leaves it waiting.
      - name: Walk the demo flow
        env:
          DB_URL: jdbc:postgresql://localhost:5432/chatledger_ci
          DB_USER: ci_user
        run: |
          rm -f /tmp/browser-demo.json /tmp/browser-demo.done
          mvn --batch-mode --no-transfer-progress --strict-checksums -pl web -am verify -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=DemoBrowserFixtureIT -Dfailsafe.failIfNoSpecifiedTests=false -Dbrowser.demo=true \
            > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fixture=$!
          for _ in $(seq 1 300); do
            [ -f /tmp/browser-demo.json ] && break
            kill -0 "$fixture" 2>/dev/null || break
            sleep 2
          done
          if [ ! -f /tmp/browser-demo.json ]; then
            echo "The fixture did not start."; tail -n 80 "$RUNNER_TEMP/fixture.log"; exit 1
          fi
          status=0
          (cd tools/browser-check && node a11y-walk.mjs) || status=$?
          touch /tmp/browser-demo.done
          wait "$fixture" || { echo "The fixture failed."; tail -n 80 "$RUNNER_TEMP/fixture.log"; status=1; }
          exit "$status"

  vulnerability-check:
    name: OWASP dependency vulnerability check
    # Run on pull requests targeting main and on the daily schedule.
    # Skipped on plain pushes to keep the push feedback loop fast.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Throwaway credentials, random for every run and masked in the log. Nothing here
      # reaches a real database; the integration tests start their own with their own random ones.
      - name: Generate throwaway credentials
        run: |
          for name in DB_PASSWORD APP_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      # ── NVD data cache ───────────────────────────────────────────────
      # The dependency-check plugin downloads NVD CVE data on first run
      # (~200 MB). Caching it avoids re-downloading the full feed on every
      # PR. The key includes run_id so the cache is always saved with
      # fresh data; restore-keys: nvd- picks up the most recent prior run.
      - name: Cache NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # ── OWASP dependency check ───────────────────────────────────────
      # NVD_API_KEY speeds up the NVD feed download and avoids rate-limiting.
      # Store the key as a repository secret named NVD_API_KEY.
      # Fails the build if any dependency has a CVSS score >= 7.
      - name: Run OWASP dependency check
        run: mvn --batch-mode --no-transfer-progress -P security-check verify -DskipTests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/chatledger_ci
          DB_USER: ci_user
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP dependency check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  # ── The image, in three jobs (task 13, the owner's change 1) ───────────────────────────────────────
  # (a) build to an archive, never pushed from here; (b) scan that archive; (c) push it, from a job that runs no third-party code.

  image-build:
    name: Image, build and drill
    runs-on: ubuntu-24.04
    needs: build-and-test
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The Maven repository build-and-test filled (the same cache, read only here: this job has no `mvn`, so nothing is saved back).
      - name: Restore the Maven repository build-and-test filled
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          # setup-java's own key: its prefix, the OS, Node's name of the architecture (x64, lower case) and the hash of the POMs.
          key: setup-java-${{ runner.os }}-x64-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build the image (no secret, no push)
        run: |
          mkdir -p "$HOME/.m2/repository"
          docker build --pull --build-arg "REVISION=${GITHUB_SHA}" --build-context m2seed="$HOME/.m2/repository" -t chat-ledger:test .

      - name: Check the image
        run: sh deploy/check-image.sh chat-ledger:test

      # The VPS stack from nothing, on this Linux runner, with this image: real file modes, uid 70 and 65532, read-only roots.
      - name: Run the stack and the smoke script
        run: sudo sh deploy/test-stack.sh "${RUNNER_TEMP}/chat-ledger-stack"

      # The upgrade a deploy makes, with its migration, from the release that runs on the VPS (RUNBOOK, "Deployed state"; task 12b):
      # old stack used, refresh stopped, migrate, web and refresh up, the smoke script, the books rules on the old data, and the time
      # without a 200. A public image of this repository, pulled without a login; nothing is pushed. Update the digest at each deploy.
      - name: Rehearse the upgrade from the deployed release
        env:
          DEPLOYED: ghcr.io/deval123/chat-ledger@sha256:1d1b70b2e2792ad7adfe7388b19c701b752ecc6d831b321d969f6c3263a48aef
        run: |
          docker pull --quiet "$DEPLOYED"
          sudo sh deploy/test-upgrade.sh "$DEPLOYED" chat-ledger:test "${RUNNER_TEMP}/chat-ledger-upgrade"

      - name: Save the archive
        id: save
        run: |
          docker save chat-ledger:test -o chat-ledger.tar
          echo "image-id=$(docker image inspect -f '{{.Id}}' chat-ledger:test)" >> "$GITHUB_OUTPUT"

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-ledger-image
          path: chat-ledger.tar
          retention-days: 3
          if-no-files-found: error

  image-scan:
    name: Image, scan
    runs-on: ubuntu-24.04
    needs: image-build
    # No packages permission: this job runs a third-party scanner.
    permissions:
      contents: read
    steps:
      - name: Download the archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chat-ledger-image

      - name: The archive is the one built
        env:
          BUILT: ${{ needs.image-build.outputs.image-id }}
        run: |
          docker load -i chat-ledger.tar
          loaded="$(docker image inspect -f '{{.Id}}' chat-ledger:test)"
          test "$loaded" = "$BUILT" || { echo "The archive is $loaded, the build produced $BUILT."; exit 1; }

      # Trivy from its own image, pinned by digest (0.76.2). Fails on a fixable HIGH or CRITICAL finding; then lists everything.
      - name: Scan (fails on fixable HIGH or CRITICAL)
        run: >
          docker run --rm --network bridge -v "${PWD}/chat-ledger.tar:/work/chat-ledger.tar:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --input /work/chat-ledger.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

      - name: List every finding (does not fail)
        if: always()
        run: >
          docker run --rm --network bridge -v "${PWD}/chat-ledger.tar:/work/chat-ledger.tar:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --input /work/chat-ledger.tar --exit-code 0 --no-progress

  image-push:
    name: Image, push
    runs-on: ubuntu-24.04
    needs: [image-build, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: image-push
    # The only job that can write a package. It runs GitHub's artifact action and the Docker CLI, nothing else.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chat-ledger-image

      - name: The archive is the one built and scanned
        env:
          BUILT: ${{ needs.image-build.outputs.image-id }}
        run: |
          docker load -i chat-ledger.tar
          loaded="$(docker image inspect -f '{{.Id}}' chat-ledger:test)"
          test "$loaded" = "$BUILT" || { echo "The archive is $loaded, the build produced $BUILT."; exit 1; }

      - name: Push by commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          BUILT: ${{ needs.image-build.outputs.image-id }}
        run: |
          ref="ghcr.io/deval123/chat-ledger:${GITHUB_SHA}"
          docker tag chat-ledger:test "$ref"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$ref"
          docker logout ghcr.io
          digest="$(docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep '^ghcr.io/deval123/chat-ledger@' | head -n 1 | cut -d@ -f2)"
          test -n "$digest" || { echo "No digest after the push."; exit 1; }
          # What the registry holds is this image: its manifest names the built image (classic store: the config is the id;
          # containerd store: the id is the manifest itself).
          manifest="$(docker buildx imagetools inspect --raw "ghcr.io/deval123/chat-ledger@${digest}")"
          if [ "$digest" != "$BUILT" ] && ! printf '%s' "$manifest" | grep -q "\"digest\": *\"${BUILT}\""; then
            echo "The pushed manifest does not name the built image ${BUILT}."; exit 1
          fi
          {
            echo "### Image pushed"
            echo ""
            echo "For /opt/chat-ledger/.env on the VPS:"
            echo ""
            echo '```'
            echo "CHAT_LEDGER_DIGEST=${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
