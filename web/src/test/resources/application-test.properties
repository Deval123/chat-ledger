# Test profile for the lightweight smoke test (no Docker).
# The database stack is not started: JPA, DataSource and Flyway are excluded, and the test
# supplies a mock DataSource. Integration tests that need a real database use Testcontainers
# in their own test class and do not use this profile.
#
# Spring Boot 4.x moved autoconfiguration classes to technology-specific packages:
#   org.springframework.boot.jdbc.autoconfigure.*     (was .autoconfigure.jdbc.*)
#   org.springframework.boot.hibernate.autoconfigure.* (was .autoconfigure.orm.jpa.*)
#   org.springframework.boot.flyway.autoconfigure.*   (was .autoconfigure.flyway.*)

spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# Nothing here is a real credential: they are random for each run (${random.*}) and reach no database.
spring.datasource.url=jdbc:postgresql://localhost:5432/chatledger_test
spring.datasource.username=${random.uuid}
spring.datasource.password=${random.uuid}
# Flyway is excluded, but the properties must resolve to avoid a "Could not resolve placeholder" failure.
spring.flyway.user=${random.uuid}
spring.flyway.password=${random.uuid}
app.secret=${random.value}${random.value}
