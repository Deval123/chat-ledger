# Test profile used by CI and local unit tests.
# The full database stack is NOT started for the lightweight smoke test.
# JPA and Flyway are disabled so the context loads without a running PostgreSQL.
# Integration tests that need a real DB use Testcontainers in their own test class.
#
# Spring Boot 4.x moved autoconfiguration classes to technology-specific packages:
#   org.springframework.boot.jdbc.autoconfigure.*     (was .autoconfigure.jdbc.*)
#   org.springframework.boot.hibernate.autoconfigure.* (was .autoconfigure.orm.jpa.*)
#   org.springframework.boot.flyway.autoconfigure.*   (was .autoconfigure.flyway.*)
# The @SpringBootTest(excludeAutoConfiguration=…) annotation in the test class is
# the authoritative exclusion; this property provides belt-and-suspenders coverage.

spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# Dummy values — these env-var placeholders must never reach a real database.
spring.datasource.url=jdbc:postgresql://localhost:5432/chatledger_test
spring.datasource.username=test
spring.datasource.password=test
app.secret=ci-test-secret-not-for-production
