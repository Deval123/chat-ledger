# The production profile (task 13). Checked at startup by StartupGuards: never with dev, Flyway off, no forwarded-header rewriting.

# Migrations run in their own process (java -jar app.jar db-migrate) with the schema owner's login; this process never holds it.
spring.flyway.enabled=false

# Secrets as files (Compose secrets under /run/secrets/, one file per property: spring.datasource.password, app.secret). They take
# precedence over the ${DB_PASSWORD} and ${APP_SECRET} placeholders of application.properties, which are then never needed.
spring.config.import=optional:configtree:/run/secrets/

# Behind the Cloudflare tunnel: TLS ends at the edge, so HSTS is written on every response (one year, includeSubDomains, no preload).
app.security.hsts=always
# Only dev.chatledger.security.ClientAddress reads X-Forwarded-For, at app.security.trusted-proxy-hops; Tomcat must not rewrite the
# client address itself.
server.forward-headers-strategy=none
# Tomcat turns a relative redirect into an absolute one built from what it sees (http://), which behind the tunnel would be a plain-HTTP
# link. Relative redirects keep the browser on the scheme and host it used.
server.tomcat.use-relative-redirects=true

# Sized for the container's 640 MiB (design stop, D7).
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=50
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# The actuator leaves the public port: it answers on 8081 on the loopback address only, which the tunnel does not route.
management.server.port=8081
management.server.address=127.0.0.1
