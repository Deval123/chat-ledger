# Development only (profile "dev"): plain-HTTP localhost.
# A Secure cookie, or one with the __Host- prefix, is not sent back over http://, so the
# session would never stick. This is the only place the cookie is relaxed. Startup fails if
# the cookie is not Secure and this profile is not active.
server.servlet.session.cookie.name=chatledger-session
server.servlet.session.cookie.secure=false
