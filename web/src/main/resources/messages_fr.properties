# French text of the demo path (task 12a, D4), for the owner's review. Not served: the locale is fixed to English
# (spring.web.locale-resolver=fixed), and StartupGuards refuses any other resolver while this file lacks a key that
# messages.properties has. A key missing here falls back to the English one.
# Rules (MessageKeysTest): only keys that exist in English, with the same placeholders; the typographic apostrophe (U+2019),
# never the ASCII one, which MessageFormat would drop; a no-break space (\u00a0) before : ; ? and !.

