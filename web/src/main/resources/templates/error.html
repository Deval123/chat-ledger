<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong - chat-ledger')}">
</head>
<body>
<main>
  <h1>Something went wrong</h1>
  <!--/* Nothing about the cause: no message, path, exception or version. The status is all the user needs. */-->
  <p id="notice" role="alert">The request could not be completed (<span th:text="${status}">500</span>).</p>
  <p><a th:href="@{/app}">Back to the app</a></p>
</main>
</body>
</html>
