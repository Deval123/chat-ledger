<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.login})}">
</head>
<body>
<a class="skip" href="#main" th:text="#{skip.main}">Skip to the main content</a>
<main id="main" tabindex="-1">
  <h1 th:text="#{login.title}">Sign in</h1>
  <!--/* One message for every kind of failure: it never says which field was wrong. */-->
  <p th:if="${param.error}" role="alert" th:text="#{login.failed}">Sign-in failed. Check your workspace code, email and password.</p>
  <p th:if="${param.logout}" role="status" th:text="#{login.signed.out}">You have signed out.</p>
  <form th:action="@{/login}" method="post">
    <p>
      <label for="workspace" th:text="#{login.workspace}">Workspace code</label><br>
      <input id="workspace" name="workspace" type="text" maxlength="32" required
             autocomplete="organization" autocapitalize="none" spellcheck="false">
    </p>
    <p>
      <label for="email" th:text="#{login.email}">Email</label><br>
      <input id="email" name="email" type="email" maxlength="254" required autocomplete="username">
    </p>
    <p>
      <label for="password" th:text="#{login.pass}">Password</label><br>
      <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password">
    </p>
    <button type="submit" th:text="#{login.submit}">Sign in</button>
  </form>
  <p th:if="${demoEnabled}"><a th:href="@{/demo}" th:text="#{login.demo}">Try the demo, no account needed</a></p>
</main>
</body>
</html>
