# ── Server ─────────────────────────────────────────────────────────────────────
spring.application.name=chat-ledger
server.port=8080

# ── Database (all credentials from environment variables; never hard-coded) ────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flyway connects as the migration role (MIGRATE_USER), not as the application
# role.  These must be set in the environment; there are no default values.
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}

# ── Actuator (health only; details only to authenticated users) ─────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ── Session cookie: strict by default ──────────────────────────────────────────
# Secure, HttpOnly, SameSite=Strict, and the __Host- prefix (which browsers only accept
# when the cookie is Secure, has path / and no domain). Only the dev profile
# (application-dev.properties, plain-HTTP localhost) may relax Secure; startup fails otherwise
# (dev.chatledger.security.StartupGuards).
server.servlet.session.cookie.name=__Host-chatledger-session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie

# ── Session lifetime, recheck and password hashing (see SecurityProperties) ────
# Defaults: idle 30m, absolute 12h, anonymous 10m, recheck 60s, 4 hashes at once.
# Override with app.security.session.idle-timeout etc. A bad value stops startup.

# ── Errors and logging: say nothing about internals ────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=never
server.error.include-binding-errors=never
server.error.include-path=never
spring.mvc.log-request-details=false

# ── Security: secrets only from env vars ────────────────────────────────────────
# Keyed hashing of log identifiers uses APP_SECRET; startup fails if it is missing,
# short (under 32 characters) or still a placeholder.
app.secret=${APP_SECRET}

# Request limits (design decision 6). The application's own guard enforces 4 KiB for login, 16 KiB for JSON
# and 64 KiB for everything else; these keep the container within the same bounds.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=128KB
spring.servlet.multipart.enabled=false
# No Server header (it names the container). An empty value sends none.
server.server-header=
# ── Static files and text (task 8) ─────────────────────────────────────────────
# The stylesheet and the vendored htmx script are served under /assets with a content hash in the name and a long cache.
# Pages stay no-store (Spring Security's default); only these files are cached. The language is fixed to English.
spring.mvc.static-path-pattern=/assets/**
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=en
spring.web.locale-resolver=fixed
