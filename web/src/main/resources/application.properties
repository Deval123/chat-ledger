# ── Server ─────────────────────────────────────────────────────────────────────
spring.application.name=chat-ledger
server.port=8080

# ── Database (all credentials from environment variables; never hard-coded) ────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Actuator (health only; details only to authenticated users) ─────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ── Security: secrets only from env vars ────────────────────────────────────────
# JWT or session secret must be supplied via environment variable APP_SECRET.
app.secret=${APP_SECRET}
